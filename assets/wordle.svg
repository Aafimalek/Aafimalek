<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<style>
  .t { transform-box: fill-box; transform-origin: center; animation: flip .5s ease-in-out both; }
  @keyframes flip { 0% { transform: scaleY(1); } 50% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
  .ch { opacity: 0; animation: pop .15s ease-out forwards; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
  .win { transform-box: fill-box; transform-origin: center; animation: hop .4s ease-out both; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .fin { opacity: 0; animation: pop .4s ease-out forwards; }
  .pg { animation: pg .01s linear both; } @keyframes pg { from { fill: transparent; stroke: #565f6b; } to { fill: #3fb950; stroke: #3fb950; } }
  .py { animation: py .01s linear both; } @keyframes py { from { fill: transparent; stroke: #565f6b; } to { fill: #d29922; stroke: #d29922; } }
  .px { animation: px .01s linear both; } @keyframes px { from { fill: transparent; stroke: #565f6b; } to { fill: #3a3f47; stroke: #3a3f47; } }
</style>
